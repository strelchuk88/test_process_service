services:
  web:
    build:
      context: ..
      dockerfile: app/Dockerfile
    container_name: web
    ports:
      - "${WEB_PORT}:8000"
    command: /bin/sh -c "alembic upgrade head && uvicorn --factory main:create_app --reload --host 0.0.0.0 --port 8000"
    restart: always
    # required: false lets `make app` run this file alone, without storages/rabbit
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
        required: false
    env_file:
      - ../.env
    volumes:
      - ../app:/app/
