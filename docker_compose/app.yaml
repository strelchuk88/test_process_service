services:
  web:
    build:
      context: ..
      dockerfile: app/Dockerfile
    container_name: web
    ports:
      - "${WEB_PORT}:8000"
    command: uvicorn --factory main:create_app --reload --host 0.0.0.0 --port 8000
    restart: always
    env_file:
      - ../.env
    volumes:
      - ../app:/app/
